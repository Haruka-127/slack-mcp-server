services:
  mcp-server:
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    image: ghcr.io/korotovsky/slack-mcp-server:latest
    restart: unless-stopped
    networks:
      - app-tier
    ports:
      - "3001:3001"
    volumes:
      - mcp_cache:/root/.cache/slack-mcp-server
    env_file:
      - .env
    environment:
      SLACK_MCP_HOST: "0.0.0.0"
      SLACK_MCP_PORT: "3001"

volumes:
  mcp_cache:

networks:
  app-tier:
    name: app-tier
    external: true
